version: '3.7'

services:
  test_db:
    image: postgres:12.2-alpine
    restart: always
    ports:
      - "12323:5432"
    environment:
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      POSTGRES_DB: test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://db:db@test_db:5432/test_db?sslmode=disable",
        "up"
      ]
    depends_on:
      test_db:
        condition: service_healthy

  app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://db:db@test_db:5432/test_db?sslmode=disable
      PORT: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully